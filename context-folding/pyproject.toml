[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project]
name = "context-folding"
version = "0.1.0"
description = "Host-neutral reversible context archive, ordinary UTF-8 files, CLI and JSON Lines RPC"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = ["tomli>=2.0.1; python_version < '3.11'"]

[project.scripts]
ctxf = "context_folding.cli:ctxf_main"
context-folding = "context_folding.cli:main"

[project.optional-dependencies]
javascript = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[tool.uv.build-backend]
module-root = "python"

[dependency-groups]
dev = []
