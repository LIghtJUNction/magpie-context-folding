name: Hash archive and containment queries

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'context-folding/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/archive-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-bridges:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CONTEXT_FOLDING_REAL_CORE_PATH: ${{ github.workspace }}/context-folding/python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: uv sync --project context-folding --frozen --extra javascript --python 3.12
      - name: TypeScript plugin checks
        run: npm run check
      - name: Python archive and source tests
        run: context-folding/.venv/bin/python -m unittest discover -s context-folding/tests -v
      - name: Live Python SDK and adapter integrations
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/context-folding/.venv/bin:$PATH"
          npm run build --prefix context-folding/sdks/typescript
          node --test --test-isolation=none context-folding/sdks/typescript/test/client.test.mjs
          cargo test --locked --manifest-path context-folding/sdks/rust/Cargo.toml
          dotnet run --project context-folding/sdks/csharp/Tests/Tests.csproj
          node --test --test-isolation=none context-folding/adapters/pi/adapter.test.mjs
